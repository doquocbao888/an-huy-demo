    <script>
      // Defensive guard against browser extensions trying to override window.fetch
      try {
        let _fetch = window.fetch;
        Object.defineProperty(window, 'fetch', {
          get: function() { return _fetch; },
          set: function(val) { _fetch = val; },
          configurable: true,
          enumerable: true
        });
      } catch (e) {
        // Safe fallback
      }
    </script>
